name: Upstream sync

# Fork-only workflow: keep out of upstream PRs (requirements.md U5).
# Weekly: open a PR that merges MobSF master into our master.
#
# Uses secret SYNC_TOKEN when set (fine-grained PAT on this repo with
# Contents, Pull requests and Workflows read/write). Without it, GITHUB_TOKEN
# is used: the PR will not trigger CI, and pushes that change workflow files fail.

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    if: github.repository == 'captainrogers69/Mobile-Security-Framework-MobSF'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        token: ${{ secrets.SYNC_TOKEN || github.token }}
    - name: Open sync PR
      env:
        GH_TOKEN: ${{ secrets.SYNC_TOKEN || github.token }}
      run: |
        git remote add upstream https://github.com/MobSF/Mobile-Security-Framework-MobSF.git
        git fetch upstream master
        if [ -z "$(git rev-list origin/master..upstream/master)" ]; then
          echo "Already up to date with upstream."
          exit 0
        fi
        git push --force origin upstream/master:refs/heads/sync/upstream
        open=$(gh pr list --head sync/upstream --state open --json number --jq 'length')
        if [ "$open" = "0" ]; then
          gh pr create --base master --head sync/upstream \
            --title "chore: sync with upstream MobSF" \
            --body "Automated weekly sync from MobSF/Mobile-Security-Framework-MobSF master."
        fi
